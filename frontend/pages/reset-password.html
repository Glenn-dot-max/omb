<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialisation du mot de passe - Oh My Brunch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="logo-container">
          <img src="../assets/logo-rond.svg" alt="Oh My Brunch" />
        </div>
        <h1>🔑 Nouveau mot de passe</h1>
        <p>Définissez votre nouveau mot de passe</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="new-password">🆕 Nouveau mot de passe</label>
          <input
            type="password"
            id="new-password"
            placeholder="Minimum 8 caractères"
            required
            autocomplete="new-password"
          />
          <div class="password-strength">
            <div class="password-strength-bar" id="strength-bar"></div>
          </div>
          <div class="password-hint">
            Au moins 8 caractères, une majuscule, une minuscule et un chiffre.
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">🔒 Confirmer le mot de passe</label>
          <input
            type="password"
            id="confirm-password"
            placeholder="Retapez le nouveau mot de passe"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
          Réinitialiser mon mot de passe
        </button>
      </form>
    </div>

    <script src="../js/config.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const resetToken = params.get("token");

      const form = document.getElementById("resetPasswordForm");
      const newPasswordInput = document.getElementById("new-password");
      const strengthBar = document.getElementById("strength-bar");
      const errorMessage = document.getElementById("errorMessage");
      const successMessage = document.getElementById("successMessage");
      const submitBtn = document.getElementById("submitBtn");

      if (!resetToken) {
        errorMessage.textContent =
          "Lien invalide. Refaites une demande de réinitialisation depuis la page de connexion.";
        errorMessage.classList.add("show");
        form
          .querySelectorAll("input, button")
          .forEach((el) => (el.disabled = true));
      }

      newPasswordInput.addEventListener("input", () => {
        const password = newPasswordInput.value;
        let strength = 0;

        if (password.length >= 8) strength++;
        if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;

        strengthBar.className = "password-strength-bar";
        if (strength === 0) {
          strengthBar.style.width = "0%";
        } else if (strength <= 2) {
          strengthBar.classList.add("strength-weak");
        } else if (strength === 3) {
          strengthBar.classList.add("strength-medium");
        } else {
          strengthBar.classList.add("strength-strong");
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const newPassword = newPasswordInput.value;
        const confirmPassword =
          document.getElementById("confirm-password").value;

        errorMessage.classList.remove("show");
        successMessage.classList.remove("show");

        if (newPassword !== confirmPassword) {
          errorMessage.textContent = "Les mots de passe ne correspondent pas.";
          errorMessage.classList.add("show");
          return;
        }

        if (newPassword.length < 8) {
          errorMessage.textContent =
            "Le mot de passe doit contenir au moins 8 caractères.";
          errorMessage.classList.add("show");
          return;
        }

        if (
          !/[A-Z]/.test(newPassword) ||
          !/[a-z]/.test(newPassword) ||
          !/[0-9]/.test(newPassword)
        ) {
          errorMessage.textContent =
            "Le mot de passe doit contenir au moins une lettre majuscule et une lettre minuscule.";
          errorMessage.classList.add("show");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "⏳ Réinitialisation en cours...";

        try {
          const response = await fetch(`${API_URL}/auth/reset-password`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              token: resetToken,
              newPassword: newPassword,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.detail || "Erreur lors de la réinitialisation.",
            );
          }

          successMessage.textContent =
            "✅ Mot de passe réinitialisé ! Redirection vers la connexion...";
          successMessage.classList.add("show");
          form.reset();

          setTimeout(() => {
            window.location.href = "/pages/login.html";
          }, 2000);
        } catch (error) {
          errorMessage.textContent = error.message;
          errorMessage.classList.add("show");
          submitBtn.disabled = false;
          submitBtn.textContent = "Réinitialiser le mot de passe";
        }
      });
    </script>
  </body>
</html>
